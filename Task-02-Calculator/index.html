
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator | CodeAlpha Task 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator">
        <header class="header">
            <div>
                <p class="tag">CODEALPHA · TASK 02</p>
                <h1>Calculator</h1>
		<h5>by pranavkajagar</h5>
            </div>
            <div class="logo">±</div>
        </header>

        <section class="screen">
            <div id="expression" class="expression">Ready to calculate</div>
            <div id="display" class="display">0</div>
            <div id="result" class="result">Result appears here</div>
        </section>

        <section class="buttons">
            <button class="utility" data-action="clear">AC</button>
            <button class="utility" data-action="delete">DEL</button>
            <button class="operator" data-value="%">%</button>
            <button class="operator" data-value="/">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button data-action="sign">±</button>
            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="equals" data-action="equals">=</button>
        </section>

        <footer>Use your keyboard or click the buttons</footer>
    </main>

    <script src="script.js"></script>
</body>
</html>

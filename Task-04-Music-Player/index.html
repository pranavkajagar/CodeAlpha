
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player | pranavkajagar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-icon">♫</div>
      <div>
        <h1>Music Player</h1>
        <p>by pranavkajagar</p>
      </div>
      <span class="live-label">YOUR LIBRARY</span>
    </header>

    <section class="layout">
      <section class="player-card">
        <div class="album-art">
          <div class="vinyl"><div class="vinyl-center">♫</div></div>
        </div>

        <span class="eyebrow">NOW PLAYING</span>
        <h2 id="songTitle">Loading music...</h2>
        <p id="artist">Your Music Library</p>

        <audio id="audio" preload="metadata"></audio>

        <div class="timeline">
          <span id="currentTime">0:00</span>
          <input id="progress" type="range" min="0" max="100" value="0"
                 aria-label="Song progress">
          <span id="duration">0:00</span>
        </div>

        <div class="controls">
          <button id="shuffleBtn" class="small-control" aria-label="Shuffle">⤨</button>
          <button id="prevBtn" class="small-control" aria-label="Previous song">|◀</button>
          <button id="playBtn" class="play-button" aria-label="Play">▶</button>
          <button id="nextBtn" class="small-control" aria-label="Next song">▶|</button>
          <button id="repeatBtn" class="small-control" aria-label="Repeat">↻</button>
        </div>

        <div class="volume-row">
          <span>🔈</span>
          <input id="volume" type="range" min="0" max="1" step="0.01"
                 value="0.8" aria-label="Volume">
          <span>🔊</span>
        </div>
        <p id="status" class="status" aria-live="polite">Ready to play</p>
      </section>

      <section class="playlist-card">
        <div class="playlist-heading">
          <div>
            <span class="eyebrow">YOUR COLLECTION</span>
            <h2>Music Library</h2>
          </div>
          <span id="songCount" class="count">0 tracks</span>
        </div>

        <div id="playlist" class="playlist">
          <p class="empty">Loading your songs...</p>
        </div>
      </section>
    </section>

    <footer>Made for music lovers · pranavkajagar</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
